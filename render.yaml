services:
  - type: worker
    name: pipedrive-escala
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PIPEDRIVE_API_TOKEN
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: RESET_HOUR
        value: "8"
